spring.application.name=finhawk-refac-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=MONTH,YEAR,DAY,VALUE,USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=false

api.security.token.secret=test-only-secret-never-used-outside-automated-tests

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=

mail.from.address=test@finhawk.app
app.frontend.url=http://localhost:5173
