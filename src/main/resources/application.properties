spring.application.name=finhawk-refac

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

api.security.token.secret=${JWT_SECRET}

# Email (SMTP generico — compativel com SendGrid, Resend, Gmail, SES)
spring.mail.host=${MAIL_HOST:smtp.sendgrid.net}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

mail.from.address=${MAIL_FROM_ADDRESS:noreply@finhawk.app}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# WhatsApp (Evolution API) -- notificacoes da agenda e de vencimentos
whatsapp.api.url=${WHATSAPP_API_URL:}
whatsapp.api.key=${WHATSAPP_API_KEY:}
whatsapp.instance.name=${WHATSAPP_INSTANCE_NAME:}
whatsapp.group.id=${WHATSAPP_GROUP_ID:}

# Valor a partir do qual um lancamento recem-criado gera um aviso extra de "valor alto"
whatsapp.large-amount-threshold=${WHATSAPP_LARGE_AMOUNT_THRESHOLD:1000}
